title: Control Freak — Hands-On with AgentControl
teaser: Take an AI assistant from placeholder line to a guarded rollout. Iterate prompts,
  swap models, evaluate offline, ship behind a safety net — all without redeploying.
description: AgentControl lets you treat prompts, models, and targeting as runtime
  configuration instead of hardcoded values. In this track you'll build Otto — the
  shopping assistant for ToggleWear, a fictional online retailer of LaunchDarkly-branded
  apparel. You'll create his first Config, route premium shoppers to a more capable
  model, iterate on his personality without redeploying, grade him offline against
  a golden dataset, and ship a risky new model behind a guarded rollout that auto-reverts
  when quality drops. By the end, Otto is live, tier-aware, evaluated, and guarded
  — and you've done it without touching deployment.
