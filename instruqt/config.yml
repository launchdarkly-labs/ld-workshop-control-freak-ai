version: "3"
virtualbrowsers:
- name: launchdarkly
  url: https://i3vcudz5ncoet6xkoaqxnos7mu0sdcpz.lambda-url.us-east-2.on.aws/?sandboxId=${_SANDBOX_ID}
virtualmachines:
- name: workstation
  image: launchdarkly/workshop-ai-configs
  shell: /bin/bash
  machine_type: n1-standard-2
secrets:
# LaunchDarkly REST API token with Editor on the workshop project. Used by
# bootstrap-ld.sh to create the segment, Config, dataset, and monitoring rule.
- name: LAUNCHDARKLY_ACCESS_TOKEN
# AgentControl / AI Configs token (separate from LAUNCHDARKLY_ACCESS_TOKEN
# because AgentControl endpoints may sit behind a distinct auth scope).
- name: LAUNCHDARKLY_AG_API_TOKEN
# AWS Bedrock credentials. The VM image provisions a BedrockProfile from these.
- name: AWS_ACCESS_KEY_ID
- name: AWS_SECRET_ACCESS_KEY
- name: AWS_REGION
