title: Control Freak — Hands-On with AgentControl
teaser: Route premium tier to a stronger model, tune the prompt live, eval before
  you ship, and watch LaunchDarkly auto-roll back a regression — without a redeploy.
description: AgentControl lets you treat prompts, models, and quality gates as runtime
  configuration. In this track you'll route Claude Sonnet to premium shoppers (Haiku
  to everyone else), edit Otto's prompt live without redeploying, run an offline eval
  with an LLM judge, then trigger a deliberately-bad scenario and watch AgentControl
  auto-roll back the variation. By the end you'll know how to be a control freak about
  your AI — in the good way.
